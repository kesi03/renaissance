name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (1.0.0, patch, minor, major)'
        required: true
        default: 'patch'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  prepare:

    name: Version Bump and Tag

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Calculate Version
        id: version
        shell: bash
        run: |

          CURRENT=$(cat version.txt | tr -d '\r\n')

          if [[ "${{ inputs.version }}" == "patch" ]]; then

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            PATCH=$((PATCH+1))

            VERSION="$MAJOR.$MINOR.$PATCH"

          elif [[ "${{ inputs.version }}" == "minor" ]]; then

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            MINOR=$((MINOR+1))
            PATCH=0

            VERSION="$MAJOR.$MINOR.$PATCH"

          elif [[ "${{ inputs.version }}" == "major" ]]; then

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

            MAJOR=$((MAJOR+1))
            MINOR=0
            PATCH=0

            VERSION="$MAJOR.$MINOR.$PATCH"

          else

            VERSION="${{ inputs.version }}"

          fi

          echo "$VERSION" > version.txt

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Commit Version
        run: |

          git add version.txt

          git commit -m "chore(release): v${{ steps.version.outputs.version }}" || echo "No changes"

      - name: Create Tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"

      - name: Push Changes
        run: |
          git push origin HEAD
          git push origin "v${{ steps.version.outputs.version }}"

  build:

    name: Build and Release

    needs: prepare

    runs-on: windows-latest

    steps:

      - name: Checkout Tagged Release
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build Solution
        run: dotnet build Renaissance.slnx -c Release --no-restore

      - name: Run Tests
        run: dotnet test -c Release --no-build

      - name: Build Plugins
        shell: pwsh
        run: ./build-vst2.ps1

      - name: Build Installer
        shell: pwsh
        run: ./build-installer.ps1

      - name: Package Plugin Bundle
        shell: pwsh
        run: |

          Compress-Archive `
            -Path artifacts\Renaissance-VST2\* `
            -DestinationPath "Renaissance-${{ needs.prepare.outputs.version }}-Plugins.zip"

      - name: Locate MSI
        id: msi
        shell: pwsh
        run: |

          $msi = Get-ChildItem `
            "artifacts\installer" `
            -Filter *.msi `
            | Sort-Object LastWriteTime -Descending `
            | Select-Object -First 1

          "path=$($msi.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Renaissance-Release
          path: |
            Renaissance-${{ needs.prepare.outputs.version }}-Plugins.zip
            ${{ steps.msi.outputs.path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:

          tag_name: ${{ needs.prepare.outputs.tag }}

          name: Renaissance v${{ needs.prepare.outputs.version }}

          generate_release_notes: true

          files: |
            Renaissance-${{ needs.prepare.outputs.version }}-Plugins.zip
            ${{ steps.msi.outputs.path }}